name: Backend Tests

on:
  push:
    paths: ['examples/fullstack-taskapp/backend/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['examples/fullstack-taskapp/backend/**', '.github/workflows/backend-tests.yml']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/fullstack-taskapp/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: examples/fullstack-taskapp/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  integration-tests:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: examples/fullstack-taskapp/backend
    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: examples/fullstack-taskapp/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start backend
        run: |
          node dist/main.js &
          sleep 5
          curl -sf http://localhost:3000/ || echo "Backend started (may not have root route)"

      - name: Run integration tests
        run: npx jest --config jest.config.js --forceExit --verbose
        env:
          API_BASE: http://localhost:3000
