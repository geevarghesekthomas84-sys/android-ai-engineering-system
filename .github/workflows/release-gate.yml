name: Release Gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 3.2.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate version format
    runs-on: ubuntu-latest
    steps:
      - name: Check semver format
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected: X.Y.Z)"
            exit 1
          fi
          echo "Version $VERSION is valid semver"

  skills:
    name: Skills
    needs: validate-version
    uses: ./.github/workflows/skills-validation.yml

  docs:
    name: Docs
    needs: validate-version
    uses: ./.github/workflows/docs-lint.yml

  security:
    name: Security
    needs: validate-version
    uses: ./.github/workflows/security-scan.yml

  backend:
    name: Backend
    needs: validate-version
    uses: ./.github/workflows/backend-tests.yml

  android:
    name: Android
    needs: validate-version
    uses: ./.github/workflows/android-build.yml

  powershell:
    name: PowerShell
    needs: validate-version
    uses: ./.github/workflows/powershell-check.yml

  gate-summary:
    name: Release readiness
    runs-on: ubuntu-latest
    needs: [skills, docs, security, backend, android, powershell]
    steps:
      - name: All checks passed
        run: |
          echo "========================================="
          echo "  Release Gate: ALL CHECKS PASSED"
          echo "  Version: ${{ inputs.version }}"
          echo "========================================="
          echo ""
          echo "Ready to create release v${{ inputs.version }}"
          echo "Create the release manually via:"
          echo "  gh release create v${{ inputs.version }} --title 'v${{ inputs.version }}' --generate-notes"
