name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site
        run: |
          mkdir -p _site
          cp README.md _site/index.md
          cp CHANGELOG.md _site/changelog.md
          cp CONTRIBUTING.md _site/contributing.md
          cp SECURITY.md _site/security.md
          cp -r docs/ _site/docs/ 2>/dev/null || true

          cat > _site/_config.yml << 'YAML'
          title: Android AI Engineering System
          description: 14 specialized AI engineering skills for professional Android development
          theme: jekyll-theme-cayman
          YAML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
