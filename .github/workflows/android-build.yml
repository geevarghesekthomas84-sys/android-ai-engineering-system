name: Android Build & Tests

on:
  push:
    paths: ['examples/fullstack-taskapp/android/**', 'examples/android-skilltest/**']
  pull_request:
    paths: ['examples/fullstack-taskapp/android/**', 'examples/android-skilltest/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-taskapp:
    name: Build TaskApp & run unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/fullstack-taskapp/android
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskapp-test-results
          path: examples/fullstack-taskapp/android/app/build/reports/
          retention-days: 14

  build-skilltest:
    name: Build SkillTest app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/android-skilltest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
