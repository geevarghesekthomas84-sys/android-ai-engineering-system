<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <style>
    @keyframes typing1 { 0%,8% { width: 0 } 12%,100% { width: 420px } }
    @keyframes typing2 { 0%,18% { width: 0 } 22%,100% { width: 340px } }
    @keyframes typing3 { 0%,28% { width: 0 } 32%,100% { width: 460px } }
    @keyframes fade1 { 0%,13% { opacity: 0 } 15%,100% { opacity: 1 } }
    @keyframes fade2 { 0%,23% { opacity: 0 } 25%,100% { opacity: 1 } }
    @keyframes fade3 { 0%,33% { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes fade4 { 0%,38% { opacity: 0 } 40%,100% { opacity: 1 } }
    @keyframes fade5 { 0%,43% { opacity: 0 } 45%,100% { opacity: 1 } }
    @keyframes fade6 { 0%,48% { opacity: 0 } 50%,100% { opacity: 1 } }
    @keyframes fade7 { 0%,53% { opacity: 0 } 55%,100% { opacity: 1 } }
    @keyframes fade8 { 0%,58% { opacity: 0 } 60%,100% { opacity: 1 } }
    @keyframes fade9 { 0%,63% { opacity: 0 } 65%,100% { opacity: 1 } }
    @keyframes fadeA { 0%,68% { opacity: 0 } 70%,100% { opacity: 1 } }
    @keyframes fadeB { 0%,73% { opacity: 0 } 75%,100% { opacity: 1 } }
    @keyframes fadeC { 0%,78% { opacity: 0 } 80%,100% { opacity: 1 } }
    @keyframes fadeD { 0%,83% { opacity: 0 } 85%,100% { opacity: 1 } }
    @keyframes fadeE { 0%,88% { opacity: 0 } 90%,100% { opacity: 1 } }
    @keyframes cursor { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .t1 { animation: typing1 12s ease-out forwards }
    .t2 { animation: typing2 12s ease-out forwards }
    .t3 { animation: typing3 12s ease-out forwards }
    .f1 { animation: fade1 12s ease-out forwards; opacity: 0 }
    .f2 { animation: fade2 12s ease-out forwards; opacity: 0 }
    .f3 { animation: fade3 12s ease-out forwards; opacity: 0 }
    .f4 { animation: fade4 12s ease-out forwards; opacity: 0 }
    .f5 { animation: fade5 12s ease-out forwards; opacity: 0 }
    .f6 { animation: fade6 12s ease-out forwards; opacity: 0 }
    .f7 { animation: fade7 12s ease-out forwards; opacity: 0 }
    .f8 { animation: fade8 12s ease-out forwards; opacity: 0 }
    .f9 { animation: fade9 12s ease-out forwards; opacity: 0 }
    .fA { animation: fadeA 12s ease-out forwards; opacity: 0 }
    .fB { animation: fadeB 12s ease-out forwards; opacity: 0 }
    .fC { animation: fadeC 12s ease-out forwards; opacity: 0 }
    .fD { animation: fadeD 12s ease-out forwards; opacity: 0 }
    .fE { animation: fadeE 12s ease-out forwards; opacity: 0 }
    text { font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace; font-size: 13px; }
    .prompt { fill: #50fa7b }
    .cmd { fill: #f8f8f2 }
    .output { fill: #8be9fd }
    .success { fill: #50fa7b }
    .skill { fill: #ff79c6 }
    .dim { fill: #6272a4 }
    .warn { fill: #ffb86c }
  </style>

  <!-- Terminal window -->
  <rect width="800" height="520" rx="10" fill="#282a36"/>
  <rect width="800" height="32" rx="10" fill="#44475a"/>
  <rect y="22" width="800" height="10" fill="#44475a"/>
  <circle cx="20" cy="16" r="6" fill="#ff5555"/>
  <circle cx="40" cy="16" r="6" fill="#f1fa8c"/>
  <circle cx="60" cy="16" r="6" fill="#50fa7b"/>
  <text x="350" y="20" fill="#f8f8f2" font-size="12" text-anchor="middle">Android AI Engineering System — Terminal Demo</text>

  <!-- Line 1: Install command -->
  <text x="20" y="60" class="prompt">$</text>
  <g class="t1" style="overflow:hidden">
    <text x="35" y="60" class="cmd">pwsh scripts/install.ps1 -Target Claude</text>
  </g>

  <!-- Install output -->
  <text x="20" y="85" class="f1 success">✓ Installing 14 skills to Claude Code...</text>
  <text x="20" y="105" class="f2 output">  android-cli, android-ui-ux-design, android-frontend-engineer,</text>
  <text x="20" y="125" class="f2 output">  android-testing-engineer, app-performance-engineer,</text>
  <text x="20" y="145" class="f2 output">  backend-api-engineer, database-offline-sync, ...</text>
  <text x="20" y="170" class="f3 success">✓ All 14 skills installed successfully</text>

  <!-- Line 2: Create app -->
  <text x="20" y="200" class="f4 prompt">$</text>
  <text x="35" y="200" class="f4 cmd">android create empty-activity --name="MyApp"</text>

  <text x="20" y="225" class="f5 success">✓ Project created at ./my-app</text>
  <text x="20" y="245" class="f5 output">  Kotlin 2.0 · Jetpack Compose · Material 3 · Gradle 8.x</text>

  <!-- Line 3: Build -->
  <text x="20" y="275" class="f6 prompt">$</text>
  <text x="35" y="275" class="f6 cmd">./gradlew assembleDebug</text>

  <text x="20" y="300" class="f7 success">BUILD SUCCESSFUL in 28s</text>
  <text x="20" y="320" class="f7 output">  app-debug.apk (4.2 MB)</text>

  <!-- Line 4: Tests -->
  <text x="20" y="350" class="f8 prompt">$</text>
  <text x="35" y="350" class="f8 cmd">./gradlew test</text>

  <text x="20" y="375" class="f9 success">Tests: 13 passed, 0 failed</text>

  <!-- Line 5: Security -->
  <text x="20" y="405" class="fA prompt">$</text>
  <text x="35" y="405" class="fA cmd">gh workflow run release-gate.yml -f version=3.2.1</text>

  <text x="20" y="430" class="fB output">  ✓ Skills validation       ✓ Docs lint</text>
  <text x="20" y="450" class="fB output">  ✓ Security scan           ✓ PowerShell check</text>
  <text x="20" y="470" class="fB output">  ✓ Backend tests (PG)      ✓ Android build</text>
  <text x="20" y="495" class="fC success">✓ Release gate: 12/12 checks passed — ready to ship</text>
</svg>
