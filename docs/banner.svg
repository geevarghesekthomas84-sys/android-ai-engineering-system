<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="50%" style="stop-color:#161B22"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3DDC84"/>
      <stop offset="100%" style="stop-color:#00BCD4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3DDC84;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#00BCD4;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7C4DFF;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>
  <rect x="0" y="296" width="1200" height="4" fill="url(#accent)" rx="0"/>
  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#3DDC84" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="300"/><line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/><line x1="480" y1="0" x2="480" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/><line x1="720" y1="0" x2="720" y2="300"/>
    <line x1="840" y1="0" x2="840" y2="300"/><line x1="960" y1="0" x2="960" y2="300"/>
    <line x1="1080" y1="0" x2="1080" y2="300"/>
  </g>
  <!-- Android robot icon -->
  <g transform="translate(80, 75)">
    <!-- Head -->
    <rect x="20" y="50" width="100" height="80" rx="10" fill="#3DDC84" opacity="0.9"/>
    <path d="M20 90 Q70 30 120 90" fill="#3DDC84" opacity="0.9"/>
    <!-- Eyes -->
    <circle cx="50" cy="75" r="6" fill="#0D1117"/>
    <circle cx="90" cy="75" r="6" fill="#0D1117"/>
    <!-- Antennae -->
    <line x1="45" y1="35" x2="35" y2="15" stroke="#3DDC84" stroke-width="4" stroke-linecap="round"/>
    <line x1="95" y1="35" x2="105" y2="15" stroke="#3DDC84" stroke-width="4" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="20" y="135" width="100" height="60" rx="8" fill="#3DDC84" opacity="0.7"/>
    <!-- Arms -->
    <rect x="-5" y="135" width="18" height="45" rx="9" fill="#3DDC84" opacity="0.6"/>
    <rect x="127" y="135" width="18" height="45" rx="9" fill="#3DDC84" opacity="0.6"/>
    <!-- AI circuit overlay -->
    <circle cx="45" cy="155" r="4" fill="none" stroke="#0D1117" stroke-width="1.5" opacity="0.5"/>
    <circle cx="95" cy="155" r="4" fill="none" stroke="#0D1117" stroke-width="1.5" opacity="0.5"/>
    <circle cx="70" cy="170" r="4" fill="none" stroke="#0D1117" stroke-width="1.5" opacity="0.5"/>
    <line x1="45" y1="155" x2="70" y2="170" stroke="#0D1117" stroke-width="1" opacity="0.4"/>
    <line x1="95" y1="155" x2="70" y2="170" stroke="#0D1117" stroke-width="1" opacity="0.4"/>
    <line x1="45" y1="155" x2="95" y2="155" stroke="#0D1117" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- Title -->
  <text x="280" y="115" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="48" fill="#E6EDF3">Android AI Engineering</text>
  <text x="280" y="165" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="48" fill="url(#accent)">System</text>
  <text x="283" y="200" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#8B949E">14 specialized AI skills for full-stack Android development</text>
  <!-- Skill icons row -->
  <g transform="translate(280, 225)" opacity="0.6">
    <rect x="0" y="0" width="72" height="28" rx="14" fill="none" stroke="#3DDC84" stroke-width="1"/>
    <text x="36" y="18" font-family="monospace" font-size="11" fill="#3DDC84" text-anchor="middle">UI/UX</text>
    <rect x="82" y="0" width="82" height="28" rx="14" fill="none" stroke="#00BCD4" stroke-width="1"/>
    <text x="123" y="18" font-family="monospace" font-size="11" fill="#00BCD4" text-anchor="middle">Frontend</text>
    <rect x="174" y="0" width="78" height="28" rx="14" fill="none" stroke="#7C4DFF" stroke-width="1"/>
    <text x="213" y="18" font-family="monospace" font-size="11" fill="#7C4DFF" text-anchor="middle">Backend</text>
    <rect x="262" y="0" width="82" height="28" rx="14" fill="none" stroke="#FF6D00" stroke-width="1"/>
    <text x="303" y="18" font-family="monospace" font-size="11" fill="#FF6D00" text-anchor="middle">Security</text>
    <rect x="354" y="0" width="76" height="28" rx="14" fill="none" stroke="#E91E63" stroke-width="1"/>
    <text x="392" y="18" font-family="monospace" font-size="11" fill="#E91E63" text-anchor="middle">DevOps</text>
    <rect x="440" y="0" width="50" height="28" rx="14" fill="none" stroke="#FFD600" stroke-width="1"/>
    <text x="465" y="18" font-family="monospace" font-size="11" fill="#FFD600" text-anchor="middle">AI</text>
    <rect x="500" y="0" width="58" height="28" rx="14" fill="none" stroke="#3DDC84" stroke-width="1"/>
    <text x="529" y="18" font-family="monospace" font-size="11" fill="#3DDC84" text-anchor="middle">+8</text>
  </g>
  <!-- Version badge -->
  <g transform="translate(1060, 30)">
    <rect width="100" height="28" rx="14" fill="#3DDC84" opacity="0.15"/>
    <text x="50" y="18" font-family="monospace" font-size="13" fill="#3DDC84" text-anchor="middle" font-weight="600">v3.1</text>
  </g>
</svg>
